name: Decode base64 assets
on:
  push:
    paths:
      - '**.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .b64 files into binaries
        run: |
          set -e
          found=0
          while IFS= read -r f; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            git rm -q "$f"
            git add "$out"
            found=1
          done < <(git ls-files '*.b64')
          if [ "$found" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Decode base64 assets"
            git push
          fi
